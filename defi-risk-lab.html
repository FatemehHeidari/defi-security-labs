<script>
const Sim = (() => {
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    let u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------------- Lending ----------------
  function borrowRate(U, m) {
    if (U <= m.kink) return m.base + m.slope1 * (U / m.kink);
    return m.base + m.slope1 + m.slope2 * ((U - m.kink) / (1 - m.kink));
  }

  function makeBorrowers(p) {
    const r = rng(p.seed || 11);
    const n = p.n || 300;
    const sizes = [];
    for (let i = 0; i < n; i++) sizes.push(Math.pow(r(), -0.55));
    const sum = sizes.reduce((a, b) => a + b, 0);
    const whaleUSD = p.totalCollUSD * p.whaleShare;
    const restUSD = p.totalCollUSD - whaleUSD;
    const out = [];
    for (let i = 0; i < n; i++) {
      let ltv = p.avgLTV + p.spread * gauss(r);
      ltv = Math.min(p.maxLTV, Math.max(0.05, ltv));
      out.push({ usd: (restUSD * sizes[i]) / sum, ltv, whale: false });
    }
    if (whaleUSD > 0) out.push({ usd: whaleUSD, ltv: Math.max(0.05, p.maxLTV - 0.02), whale: true });
    return out;
  }

  // One crash run. capacity = collateral value liquidators can sell before slippage eats the bonus.
  function runLending(p, shock, capacity) {
    const P0 = p.price0, P1 = P0 * (1 - shock);
    const LT = p.lt, b = p.bonus, CF = p.closeFactor;
    const pos = p.borrowers.map(x => ({ coll: x.usd / P0, debt: x.usd * x.ltv, debt0: x.usd * x.ltv, whale: x.whale, liq: false }));
    pos.sort((a, c) => (c.debt / c.coll) - (a.debt / a.coll)); // highest liquidation price first
    const steps = [];
    if (p.mode === 'gap' || shock <= 0) steps.push(P1);
    else { const k = p.steps || 60; for (let i = 1; i <= k; i++) steps.push(P0 + (P1 - P0) * (i / k)); }
    let used = 0, repaid = 0, exhausted = false;
    for (const price of steps) {
      for (const q of pos) {
        if (q.coll * price * LT >= q.debt) continue;
        let rounds = 0;
        while (q.debt > 1e-6 && q.coll > 1e-12 && q.coll * price * LT < q.debt && rounds < 400) {
          rounds++;
          let R = Math.min(CF * q.debt, (q.coll * price) / (1 + b));
          let val = R * (1 + b);
          if (used + val > capacity) {
            val = Math.max(0, capacity - used); R = val / (1 + b); exhausted = true;
          }
          if (R <= 1e-9) break;
          q.debt -= R; q.coll -= val / price; used += val; repaid += R; q.liq = true;
          if (exhausted) break;
        }
      }
    }
    let badDebt = 0, stuckCount = 0, stuckDebt = 0, whaleBad = 0;
    for (const q of pos) {
      const bd = Math.max(0, q.debt - q.coll * P1);
      badDebt += bd;
      if (q.whale) whaleBad += bd;
      if (q.coll * P1 * LT < q.debt - 1e-6) { stuckCount++; stuckDebt += q.debt; }
    }
    return { badDebt, seized: used, repaid, stuckCount, stuckDebt, exhausted, whaleBad, P1, positions: pos };
  }

  function lending(p) {
    const borrowers = makeBorrowers(p);
    const q = Object.assign({}, p, { borrowers });
    const totalBorrowed = borrowers.reduce((s, x) => s + x.usd * x.ltv, 0);
    const P1 = p.price0 * (1 - p.shock);
    let liqCount = 0, liqDebt = 0;
    for (const x of borrowers) {
      const coll = x.usd / p.price0, debt = x.usd * x.ltv;
      if (coll * P1 * p.lt < debt) { liqCount++; liqDebt += debt; }
    }
    const capacity = p.bonus * p.dexDepth;
    const demand = runLending(q, p.shock, Infinity);
    const real = runLending(q, p.shock, capacity);
    const slipAll = demand.seized / (p.dexDepth + demand.seized);
    const U = totalBorrowed / p.supply;
    const bRate = borrowRate(Math.min(U, 1), p.rates);
    const sRate = bRate * Math.min(U, 1) * (1 - p.rates.reserve);
    const curve = [];
    const qs = Object.assign({}, q, { steps: 30 });
    for (let s = 0; s <= 0.8001; s += 0.02) curve.push([s, runLending(qs, s, capacity).badDebt]);
    const whale = borrowers.find(x => x.whale);
    return {
      n: borrowers.length, totalBorrowed, totalColl: p.totalCollUSD, liqCount, liqDebt, capacity,
      demand: demand.seized, slipAll, seized: real.seized, badDebt: real.badDebt, stuckCount: real.stuckCount,
      stuckDebt: real.stuckDebt, exhausted: real.exhausted, whaleBad: real.whaleBad, whaleShare: p.whaleShare,
      whaleLTV: whale ? whale.ltv : 0,
      U, bRate, sRate, curve, P1,
      paramLtvOk: p.maxLTV < p.lt, paramBonusOk: p.lt * (1 + p.bonus) < 1,
      cushion: 1 - p.maxLTV / p.lt
    };
  }

  // ---------------- AMM ----------------
  function cpSell(x, y, dx, fee) { const d = dx * (1 - fee); return (y * d) / (x + d); }
  function cpBuy(x, y, dy, fee) { const d = dy * (1 - fee); return (x * d) / (y + d); }

  function clLiquidity(capital, P, Pa, Pb) {
    const sp = Math.sqrt(P), sa = Math.sqrt(Pa), sb = Math.sqrt(Pb);
    const perL = (1 / sp - 1 / sb) * P + (sp - sa);
    return capital / perL;
  }
  function clSell(L, P, Pa, dx, fee) {
    const sp = Math.sqrt(P), sa = Math.sqrt(Pa);
    const d = dx * (1 - fee);
    const maxIn = L * (1 / sa - 1 / sp);
    if (d >= maxIn) return { out: L * (sp - sa), filledIn: maxIn / (1 - fee), exhausted: true, newP: Pa };
    const spNew = (L * sp) / (L + d * sp);
    return { out: L * (sp - spNew), filledIn: dx, exhausted: false, newP: spNew * spNew };
  }

  function amm(p) {
    const P = p.price, fee = p.fee;
    const x = p.tvl / 2 / P, y = p.tvl / 2;
    const dx = p.trade / P;
    const cpOut = cpSell(x, y, dx, fee);
    const cpNewP = (y - cpOut) / (x + dx * (1 - fee));
    const cpSlip = 1 - cpOut / (dx * P);
    const Pa = P * (1 - p.range), Pb = P * (1 + p.range);
    const L = clLiquidity(p.tvl, P, Pa, Pb);
    const cl = clSell(L, P, Pa, dx, fee);
    const clSlip = cl.exhausted ? 1 - cl.out / (dx * P) : 1 - cl.out / (dx * P);
    const efficiency = (2 * L * Math.sqrt(P)) / p.tvl;
    const curveCP = [], curveCL = [];
    for (let i = 0; i <= 60; i++) {
      const v = Math.pow(10, 3 + (i / 60) * 4); // $1k .. $10M
      const ddx = v / P;
      curveCP.push([v, (1 - cpSell(x, y, ddx, fee) / (ddx * P)) * 100]);
      const c = clSell(L, P, Pa, ddx, fee);
      curveCL.push([v, (1 - c.out / (ddx * P)) * 100]);
    }
    return { x, y, cpOut, cpNewP, cpSlip, L, cl, clSlip, Pa, Pb, efficiency, curveCP, curveCL };
  }

  function sandwich(p) {
    const fee = p.fee, P = p.price;
    const x0 = p.tvl / 2 / P, y0 = p.tvl / 2;
    const U = p.victim;
    const expected = cpBuy(x0, y0, U, fee);
    const minOut = expected * (1 - p.tol);
    function attempt(A) {
      const xa = cpBuy(x0, y0, A, fee);
      const x1 = x0 - xa, y1 = y0 + A;
      const ov = cpBuy(x1, y1, U, fee);
      if (ov < minOut) return null;
      const x2 = x1 - ov, y2 = y1 + U;
      const proceeds = cpSell(x2, y2, xa, fee);
      return { A, profit: proceeds - A, victimOut: ov };
    }
    let lo = 0, hi = y0 * 50;
    for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (attempt(mid)) lo = mid; else hi = mid; }
    const maxA = lo;
    let best = { A: 0, profit: 0, victimOut: expected };
    for (let i = 1; i <= 200; i++) {
      const r = attempt((maxA * i) / 200);
      if (r && r.profit > best.profit) best = r;
    }
    const victimLossTokens = expected - best.victimOut;
    return {
      expected, minOut, maxA, best, profitable: best.profit > 1,
      victimLossUSD: victimLossTokens * (U / expected), victimLossPct: victimLossTokens / expected
    };
  }

  // ---------------- Perps (vAMM, in the style of Perpetual Protocol v1) ----------------
  function traderValue(Q, B, n) { return (Q * n) / (B + n); } // value traders get if the net position closes
  function perps(p) {
    const P0 = p.price0, B0 = p.depth, Q0 = P0 * B0, k = Q0 * B0;
    const n = p.skew;
    const B = B0 - n, Q = k / B, mark = Q / B;
    const index = P0 * (1 + p.oracleMove);
    const premium = mark - index;
    const spread = premium / index;
    const longs = (p.oi + n) / 2, shorts = (p.oi - n) / 2;
    const perHour = premium / 24;
    const longsPayHr = longs * perHour, shortsGetHr = shorts * perHour, fundHr = n * perHour;
    const trigger = Math.abs(spread) > 0.10;
    const target = mark > index ? index * 1.05 : index * 0.95;
    let Qr = B * Math.sqrt(mark * target), Br = B * Math.sqrt(mark / target);
    let fallback = false;
    if (n < 0 && Br <= Math.abs(n)) { Qr = B * target; Br = B; fallback = true; }
    const repegCost = traderValue(Qr, Br, n) - traderValue(Q, B, n);
    const kCutCost = traderValue(0.99 * Qr, 0.99 * Br, n) - traderValue(Q, B, n);
    const budget = p.fund * p.budgetShare;
    const s = p.kScale;
    const kCost = traderValue(s * Q, s * B, n) - traderValue(Q, B, n);
    const kb = s * s * k;
    const slip1 = (() => { const Bn = B - 1; const cost = k / Bn - Q; return cost / mark - 1; })();
    const slip1k = (() => { const Bs = s * B, Qs = s * Q; const cost = kb / (Bs - 1) - Qs; return cost / mark - 1; })();
    const mevPct = trigger ? Math.abs((mark > index ? Math.min(mark, index * 1.10) - target : Math.max(mark, index * 0.90) - target)) / (mark > index ? Math.min(mark, index * 1.10) : Math.max(mark, index * 0.90)) : 0;
    return {
      B, Q, mark, index, premium, spread, longs, shorts, longsPayHr, shortsGetHr, fundHr, fundDay: fundHr * 24,
      trigger, target, repegCost, kCutCost, budget, fallback, kCost, slip1, slip1k, mevPct
    };
  }

  function perpCrash(p) {
    const r = rng(p.seed || 5);
    const N = 200, P0 = p.price0, P1 = P0 * (1 - p.crash);
    const MM = p.mm, fee = p.liqFee;
    const unit = p.oi / N; // contracts per trader
    let bad = 0, toFund = 0, toLiq = 0, liquidated = 0, underwater = 0;
    for (let i = 0; i < N; i++) {
      const isLong = r() < p.longShare;
      const lev = Math.max(1, Math.min(20, 1 + r() * 2 * (p.avgLev - 1)));
      const notional0 = unit * P0, margin = notional0 / lev;
      const dir = isLong ? 1 : -1;
      const liqPrice = isLong ? (unit * P0 - margin) / (unit * (1 - MM)) : (margin + unit * P0) / (unit * (1 + MM));
      const hit = isLong ? P1 <= liqPrice : P1 >= liqPrice;
      if (!hit) continue;
      liquidated++;
      const px = p.mode === 'gap' ? P1 : liqPrice;
      const equity = margin + dir * unit * (px - P0);
      const f = unit * px * fee;
      if (equity < 0) { bad += -equity; underwater++; continue; }
      const liqCut = Math.min(equity, f / 2);
      toLiq += liqCut; toFund += equity - liqCut;
    }
    const blocks = Math.log(1 - p.crash) / Math.log(1 - 0.02);
    return { bad, toFund, toLiq, liquidated, underwater, net: toFund - bad, blocks, N };
  }

  // ---------------- Liquid staking ----------------
  function lst(p) {
    const rate = Math.pow(1 + p.apr / 365, p.days);
    const d = p.discount;
    const marketRate = rate * (1 - d);
    const arbReturn = d / (1 - d);
    const arbAnnual = arbReturn * (365 / Math.max(1, p.wait));
    const collTKN = p.collUnits * rate;
    const debt = collTKN * p.ltv;
    const hfRedeem = (collTKN * p.lt) / debt;
    const hfMarket = (collTKN * (1 - d) * p.lt) / debt;
    const oracleToMarket = p.oracle === 'market' ? 1 : (1 - d);
    const liqProfit = (1 + p.bonus) * oracleToMarket * (1 - p.dexSlip) - 1;
    const loops = p.loops;
    const lev = (1 - Math.pow(p.ltv, loops + 1)) / (1 - p.ltv);
    const leff = (lev - 1) / lev;
    const netApr = p.apr * lev - p.borrowApr * (lev - 1);
    const loopHfMarket = ((1 - d) * p.lt) / leff;
    const loopHfRedeem = p.lt / leff;
    const loopLiqDiscount = 1 - leff / p.lt;
    return { rate, marketRate, arbReturn, arbAnnual, hfRedeem, hfMarket, liqProfit, lev, leff, netApr, loopHfMarket, loopHfRedeem, loopLiqDiscount };
  }

  // ---------------- Oracles ----------------
  function oracle(p) {
    const r = rng(p.seed || 3);
    const T = 240;
    const truth = [];
    let price = p.price0;
    for (let t = 0; t <= T; t++) {
      if (t > 0) {
        let ret = p.vol * gauss(r);
        if (t > p.crashAt && t <= p.crashAt + p.crashLen) ret += Math.log(1 - p.crash) / p.crashLen;
        price = price * Math.exp(ret);
      }
      truth.push(price);
    }
    const reported = [], age = [], conf = [];
    let last = truth[0], lastT = 0, volEma = p.vol;
    for (let t = 0; t <= T; t++) {
      if (t > 0) volEma = 0.75 * volEma + 0.25 * Math.abs(Math.log(truth[t] / truth[t - 1]));
      const out = p.outageLen > 0 && t >= p.outageAt && t < p.outageAt + p.outageLen;
      if (!out) {
        const dev = Math.abs(truth[t] - last) / last;
        if (t === 0 || dev >= p.deviation || t - lastT >= p.heartbeat) { last = truth[t]; lastT = t; }
      }
      reported.push(last); age.push(t - lastT);
      conf.push(0.0005 + 3 * volEma);
    }
    const twap = [];
    for (let t = 0; t <= T; t++) {
      const a = Math.max(0, t - p.twap + 1);
      let s = 0; for (let u = a; u <= t; u++) s += reported[u];
      twap.push(s / (t - a + 1));
    }
    const source = p.source === 'twap' ? twap : reported;
    const accepted = [];
    let pausedMin = 0, staleMin = 0, confMin = 0;
    for (let t = 0; t <= T; t++) {
      const stale = age[t] > p.maxAge, wide = conf[t] > p.maxConf;
      if (stale) staleMin++;
      if (wide) confMin++;
      const ok = !stale && !wide;
      if (!ok) pausedMin++;
      accepted.push(ok);
    }
    let maxDev = 0, maxDevT = 0;
    for (let t = 0; t <= T; t++) {
      const dv = Math.abs(source[t] - truth[t]) / truth[t];
      if (dv > maxDev) { maxDev = dv; maxDevT = t; }
    }
    const level = p.price0 * (1 - p.trigger);
    let tTrue = -1, tProt = -1;
    for (let t = 0; t <= T; t++) { if (truth[t] <= level) { tTrue = t; break; } }
    for (let t = 0; t <= T; t++) { if (accepted[t] && source[t] <= level) { tProt = t; break; } }
    return { T, truth, reported, twap, source, conf, age, accepted, pausedMin, staleMin, confMin, maxDev, maxDevT, level, tTrue, tProt };
  }

  function flashAttack(p) {
    const m = Math.pow(1 + p.loan / p.depth, 2); // spot price multiplier after buying with the loan
    const twapM = 1 + (m - 1) * Math.min(1, p.hold / (p.twapWin * 60));
    const roundTrip = p.loan * (1 - Math.pow(1 - p.fee, 2)) + p.loan * p.loanFee;
    const spotBorrow = p.coll * m * p.ltv;
    const twapBorrow = p.coll * twapM * p.ltv;
    const spotProfit = spotBorrow - p.coll - roundTrip;
    const twapProfit = twapBorrow - p.coll - roundTrip;
    const breakEvenM = (p.coll + roundTrip) / (p.coll * p.ltv);
    const loanNeeded = p.depth * (Math.sqrt(breakEvenM) - 1);
    return { m, twapM, roundTrip, spotBorrow, twapBorrow, spotProfit, twapProfit, breakEvenM, loanNeeded };
  }

  // ---------------- Vault (ERC-4626 share accounting) ----------------
  function mulDiv(a, b, c, up) {
    if (c === 0n) return 0n;
    const q = (a * b) / c;
    if (up && (a * b) % c !== 0n) return q + 1n;
    return q;
  }
  function vault(p) {
    const off = p.defense === 'none' ? null : BigInt(10) ** BigInt(p.offset);
    let A = p.A0, S = p.S0;
    const vs = () => (off === null ? S : S + off);
    const va = () => (off === null ? A : A + 1n);
    function toShares(assets) {
      if (off === null && S === 0n) return assets;
      if (off === null && A === 0n) return assets;
      return mulDiv(assets, vs(), va(), p.roundUp);
    }
    function toAssets(shares) {
      if (off === null && S === 0n) return 0n;
      return mulDiv(shares, va(), vs(), false);
    }
    const log = [];
    let attShares = 0n, vicShares = 0n;
    function snap(step, action, kind) {
      log.push({ step, action, A, S, vsh: vs(), vas: va(), kind });
    }
    snap(0, 'Starting vault', 'start');
    const s1 = toShares(p.attDeposit); A += p.attDeposit; S += s1; attShares += s1;
    snap(1, 'Attacker deposits', 'deposit');
    A += p.donation;
    snap(2, 'Attacker donates (direct transfer)', 'donate');
    const s3 = toShares(p.victim); A += p.victim; S += s3; vicShares += s3;
    snap(3, 'Victim deposits', 'deposit');
    const a4 = toAssets(attShares); A -= a4; S -= attShares;
    snap(4, 'Attacker redeems all shares', 'redeem');
    const a5 = toAssets(vicShares); A -= a5; S -= vicShares;
    snap(5, 'Victim redeems all shares', 'redeem');
    // prover-style check on deposits and redeems: new_vs * old_va <= old_vs * new_va  (share price never decreases)
    for (let i = 1; i < log.length; i++) {
      const o = log[i - 1], c = log[i];
      if (c.kind === 'deposit' || c.kind === 'redeem') {
        if (o.vsh === 0n || c.vsh === 0n) { c.check = 'n/a'; continue; }
        c.check = (c.vsh * o.vas <= o.vsh * c.vas) ? 'pass' : 'fail';
      } else c.check = '';
    }
    const attSpent = p.attDeposit + p.donation;
    return {
      log, s1, s3, a4, a5, attProfit: a4 - attSpent, victimLoss: p.victim - a5,
      victimShares: s3, leftover: A
    };
  }

  return { rng, gauss, borrowRate, lending, runLending, makeBorrowers, cpSell, cpBuy, clLiquidity, clSell, amm, sandwich, traderValue, perps, perpCrash, lst, oracle, flashAttack, vault, mulDiv };
})();
if (typeof module !== 'undefined') module.exports = Sim;

</script>
<script>
const Roles = (() => {
  const S = typeof Sim !== 'undefined' ? Sim : require('./sim.js');
  const MINUS = '−';
  // tiny local formatters so role text is self-contained
  const num = (v, d = 2) => Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const money = (unit, v) => {
    const s = v < 0 ? MINUS : '';
    if (unit === 'usd') return s + '$' + num(v, Math.abs(v) >= 1e5 ? 0 : 2);
    if (unit === 'usdc') return s + num(v, Math.abs(v) >= 1e5 ? 0 : 2) + ' USDC';
    if (unit === 'eth') return s + num(v, 3) + ' ETH';
    if (unit === 'tkn') return s + num(v, 2) + ' TKN';
    return s + num(v);
  };
  const pct = (v, d = 1) => (v < 0 ? MINUS : '') + Math.abs(v * 100).toFixed(d) + '%';
  const spct = (v, d = 1) => (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v * 100).toFixed(d) + '%';

  // ---------- Lending ----------
  function lending(st, r, you) {
    const A = you.yAmount, s = st.shock, P0 = 2, P1 = P0 * (1 - s), b = st.bonus, $ = v => money('usd', v);
    const roles = [];
    const interest = A * r.sRate;
    const loss = Math.min(A, (r.badDebt / st.supply) * A);
    const freeShare = Math.max(0, 1 - r.U);
    roles.push({
      key: 'lender', name: 'Lender', unit: 'usd', start: A,
      who: `Deposits ${$(A)} of USDC for borrowers to use.`,
      steps: [['Interest for one year at ' + pct(r.sRate, 2), interest], ['Share of the crash’s bad debt', -loss]],
      end: A + interest - loss,
      verdict: loss > 0
        ? `Lenders absorb bad debt. Your share is ${$(loss)}, which would take ${(loss / Math.max(interest, 1e-9)).toFixed(1)} years of interest to earn back.`
        : r.U > 0.95 ? `No loss, but only ${pct(freeShare, 0)} of the pool is free to withdraw right now.` : `No bad debt reaches you at a ${pct(s, 0)} drop. You earn the lender rate.`
    });
    const L = Math.min(you.yLtv, st.maxLTV);
    const D = A * L;
    const run = S.runLending({ price0: P0, lt: st.lt, bonus: b, closeFactor: st.cf, mode: st.mode, steps: 60, borrowers: [{ usd: A, ltv: L }] }, s, Infinity);
    const q = run.positions[0];
    const collVal = q.coll * P1;
    const under = q.debt > collVal + 1e-9;
    const bEnd = D + Math.max(0, collVal - q.debt);
    const hold = A * (1 - s);
    const bSteps = [['TKN price drop (same as just holding)', -A * s]];
    const bonusPaid = run.repaid * b, earlyEffect = bEnd - hold + bonusPaid;
    if (q.liq && under) bSteps.push(['Debt you walk away from (lenders absorb it)', bEnd - hold]);
    else if (q.liq) {
      bSteps.push(['Liquidation bonus paid to liquidators', -bonusPaid]);
      if (Math.abs(earlyEffect) > 0.005) bSteps.push(['Collateral sold earlier in the drop, at higher prices', earlyEffect]);
    }
    const hf0 = (A * st.lt) / D, hf1 = (A * (1 - s) * st.lt) / D;
    const capNote = you.yLtv > st.maxLTV ? `Max LTV is ${pct(st.maxLTV, 0)}, so that is all you can borrow. ` : '';
    roles.push({
      key: 'borrower', name: 'Borrower', unit: 'usd', start: A,
      who: `Posts ${$(A)} of TKN and borrows ${$(D)} of USDC (${pct(L, 0)} LTV), keeping the USDC in the wallet.`,
      steps: bSteps, end: bEnd,
      verdict: capNote + (!q.liq
        ? `Health factor ${hf0.toFixed(2)} → ${hf1.toFixed(2)}. You’re never liquidated, so you lose only what TKN lost.`
        : under
          ? `Your loan ended underwater: the collateral left is worth less than the debt. You keep the ${$(D)} you borrowed, and lenders absorb ${$(q.debt - collVal)}.`
          : `Liquidators took ${num(A / P0 - q.coll, 0)} TKN of your collateral and charged ${$(bonusPaid)} in bonuses. Repaying or adding collateral before your health factor hit 1 would have avoided that.` + (earlyEffect > 0.005 ? ` Because they sold part of your TKN on the way down, you still end above someone who just held.` : ''))
    });
    const depth = st.depth, out = X => (X * depth) / (depth + X);
    if (r.demand <= 0) {
      ['first', 'last'].forEach(k => roles.push({ key: 'liq-' + k, name: k === 'first' ? 'Liquidator, first in line' : 'Liquidator, last in line', unit: 'usd', start: A, steps: [], end: A, who: `Holds ${$(A)} of USDC, ready to liquidate.`, verdict: 'Nothing to liquidate at this drop. The capital sits idle.' }));
    } else {
      const R = Math.min(A, r.demand / (1 + b)), V = R * (1 + b);
      const Uq = Math.max(0, Math.min(r.demand, r.capacity) - V);
      const oF = out(V), oL = out(Uq + V) - out(Uq);
      roles.push({ key: 'liq-first', name: 'Liquidator, first in line', unit: 'usd', start: A, who: `Holds ${$(A)} of USDC and wins the race to liquidate.`,
        steps: [['Repays borrowers’ debt', -R], ['Receives TKN worth (debt + bonus)', V], ['Slippage selling that TKN', oF - V]], end: A - R + oF,
        verdict: `You sell ${$(V)} of TKN into an untouched market at ${pct(1 - oF / V, 2)} slippage, under the ${pct(b, 1)} bonus.` });
      roles.push({ key: 'liq-last', name: 'Liquidator, last in line', unit: 'usd', start: A, who: `Same capital, but ${$(Uq)} of seized TKN was sold ahead of you.`,
        steps: [['Repays borrowers’ debt', -R], ['Receives TKN worth (debt + bonus)', V], ['Slippage selling that TKN', oL - V]], end: A - R + oL,
        verdict: oL - R < 0 ? `By the time you sell, slippage is ${pct(1 - oL / V, 2)}, more than the bonus. Rational liquidators stop here, which is how positions get stuck.` : `Even last in line, slippage of ${pct(1 - oL / V, 2)} stays under the bonus.` });
    }
    roles.push({ key: 'holder', name: 'Just holds TKN', unit: 'usd', start: A, who: `Owns ${$(A)} of TKN and does nothing.`, steps: [['TKN price drop', -A * s]], end: hold, verdict: 'The baseline: no DeFi, only the price move.' });
    return roles;
  }

  // ---------- AMM ----------
  function amm(st, model, you) {
    const A = you.yAmount, P = 2, fee = st.fee, $ = v => money('usd', v);
    const x = st.tvl / 2 / P, y = st.tvl / 2;
    const Pa = P * (1 - st.range), Pb = P * (1 + st.range);
    const roles = [];
    const oCP = S.cpSell(x, y, A / P, fee);
    roles.push({ key: 'seller', name: 'Seller, full-range pool', unit: 'usd', start: A, who: `Sells ${$(A)} of TKN into the $${(st.tvl / 1e6).toFixed(1)}M pool.`,
      steps: [['Price impact and fee', oCP - A]], end: oCP, verdict: `You receive ${$(oCP)}, ${pct(1 - oCP / A, 2)} below the $2.00 price.` });
    const Lp = S.clLiquidity(st.tvl, P, Pa, Pb);
    const cl = S.clSell(Lp, P, Pa, A / P, fee);
    const unsold = Math.max(0, A / P - cl.filledIn) * P;
    roles.push({ key: 'seller-cl', name: 'Seller, concentrated pool', unit: 'usd', start: A, who: `Sells the same ${$(A)} into the same capital concentrated in ±${pct(st.range, 0)}.`,
      steps: [['Price impact and fee', cl.out + unsold - A]].concat(unsold > 0 ? [['(TKN left unsold, valued at $2.00)', unsold, 'info']] : []), end: cl.out + unsold,
      verdict: cl.exhausted ? `The price hits the bottom of the range at $${Pa.toFixed(2)}. Only ${$(cl.filledIn * P)} sells; you keep ${$(unsold)} of TKN.` : `Same capital, ${(model.r.efficiency).toFixed(1)}× deeper near the price: ${pct(1 - cl.out / A, 2)} slippage.` });
    const rr = 1 + you.yMove, P2 = P * rr;
    const v2 = A * Math.sqrt(rr), hodl2 = (A * (1 + rr)) / 2, fees2 = you.yVol * fee * A;
    roles.push({ key: 'lp', name: 'LP, full range', unit: 'usd', start: A, who: `Deposits ${$(A)} half TKN, half USDC across all prices.`,
      steps: [[`TKN moves ${spct(you.yMove, 0)}: position value change`, v2 - A], [`Fees on ${you.yVol}× the pool in volume`, fees2]], end: v2 + fees2,
      verdict: `Holding the same TKN and USDC instead would be worth ${$(hodl2)}. Impermanent loss: ${$(v2 - hodl2)}${fees2 + v2 - hodl2 >= 0 ? ', which the fees cover.' : ', more than the fees earned.'}` });
    const Lc = S.clLiquidity(A, P, Pa, Pb), sa = Math.sqrt(Pa), sb = Math.sqrt(Pb), s0 = Math.sqrt(P), s2 = Math.sqrt(P2);
    const amt = sp => sp <= sa ? [Lc * (1 / sa - 1 / sb), 0] : sp >= sb ? [0, Lc * (sb - sa)] : [Lc * (1 / sp - 1 / sb), Lc * (sp - sa)];
    const [x0, y0] = amt(s0), [x2, y2] = amt(s2);
    const vCL = x2 * P2 + y2, hodlC = x0 * P2 + y0;
    const eff = (2 * Lc * s0) / A;
    const inRange = Math.abs(you.yMove) <= st.range ? 1 : st.range / Math.abs(you.yMove);
    const feesC = you.yVol * fee * A * eff * inRange;
    roles.push({ key: 'lp-cl', name: `LP, ±${pct(st.range, 0)} range`, unit: 'usd', start: A, who: `Deposits ${$(A)} concentrated between $${Pa.toFixed(2)} and $${Pb.toFixed(2)}.`,
      steps: [[`TKN moves ${spct(you.yMove, 0)}: position value change`, vCL - A], [`Fees (${eff.toFixed(1)}× a full-range share${inRange < 1 ? `, in range ${pct(inRange, 0)} of the way` : ''})`, feesC]], end: vCL + feesC,
      verdict: (P2 < Pa || P2 > Pb ? `The price left your range, so the position is now all ${P2 < Pa ? 'TKN' : 'USDC'} and earns nothing more. ` : '') + `Holding instead: ${$(hodlC)}. Impermanent loss: ${$(vCL - hodlC)}.` });
    const sw = S.sandwich({ price: P, tvl: st.tvl, victim: A, tol: st.tol, fee });
    const got = sw.profitable ? sw.best.victimOut : sw.expected;
    roles.push({ key: 'victim', name: 'Buyer (sandwich victim)', unit: 'usd', start: A, who: `Buys TKN with ${$(A)} at ${pct(st.tol, 1)} slippage tolerance.`,
      steps: [['Normal price impact and fee', sw.expected * P - A], ['Taken by a sandwich bot', (got - sw.expected) * P]], end: got * P,
      verdict: sw.profitable ? `A bot front-runs with ${$(sw.best.A)} and pushes you to your minimum. Tighter tolerance or a private transaction route prevents it.` : `At this tolerance a sandwich doesn’t pay, so you only pay normal price impact.` });
    roles.push({ key: 'bot', name: 'Sandwich bot', unit: 'usd', start: sw.profitable ? sw.best.A : 0, who: sw.profitable ? `Buys ${$(sw.best.A)} of TKN just before the victim and sells right after.` : 'Watches the mempool for loose slippage settings.',
      steps: sw.profitable ? [['Front-run, victim trade, back-run', sw.best.profit]] : [], end: sw.profitable ? sw.best.A + sw.best.profit : 0,
      verdict: sw.profitable ? `Risk-free inside one block, paid for by the victim.` : 'No profitable sandwich on this trade, so the bot stays out.' });
    return roles;
  }

  // ---------- Perps ----------
  function perps(st, model, you) {
    const { r, c } = model, A = you.yAmount, L = you.yLev, MM = 0.0625, e = v => money('eth', v);
    const k = r.Q * r.B, q = Math.min(A * L, 0.9 * r.Q);
    const Bl = k / (r.Q + q), baseL = r.B - Bl, entryL = q / baseL;
    const Bs = k / (r.Q - q), baseS = Bs - r.B, entryS = q / baseS;
    const P1 = r.mark * (1 - st.crash);
    const roles = [];
    function trader(dir) {
      const base = dir > 0 ? baseL : baseS, entry = dir > 0 ? entryL : entryS;
      const fund = -dir * r.premium * base; // + means trader receives
      const m0 = A + fund;
      const pnl = dir * base * (P1 - entry);
      const eq = m0 + pnl;
      const liqP = dir > 0 ? (base * entry - m0) / (base * (1 - MM)) : (m0 + base * entry) / (base * (1 + MM));
      const hit = dir > 0 ? P1 <= liqP : P1 >= liqP;
      const gap = st.mode === 'gap';
      const exitP = hit && !gap ? liqP : P1;
      const pnlX = dir * base * (exitP - entry), eqX = m0 + pnlX;
      const steps = [[`Funding for one day`, fund], [`Price ${entry.toFixed(2)} → ${exitP.toFixed(2)} ETH`, pnlX]];
      let end = eqX;
      if (hit) {
        if (eqX < 0) steps.push(['Losses past your margin, paid by the insurance fund', -eqX]);
        else steps.push(['Liquidated: what’s left goes to the liquidator and the fund', -eqX]);
        end = 0;
      }
      const slip = dir > 0 ? entry / r.mark - 1 : 1 - entry / r.mark;
      return {
        key: dir > 0 ? 'long' : 'short', name: dir > 0 ? `Long ${L}×` : `Short ${L}×`, unit: 'eth', start: A,
        who: `Opens ${L}× with ${e(A)}: ${base.toFixed(3)} contracts at ${entry.toFixed(2)} ETH (${pct(slip, 2)} vAMM price impact), holds a day, then the ${pct(st.crash, 0)} ${st.mode === 'gap' ? 'gap' : 'drop'} hits.`,
        steps, end,
        verdict: hit ? (eqX < 0 ? `The gap jumped straight past your liquidation price (${liqP.toFixed(2)} ETH) to ${P1.toFixed(2)}. You lose all your margin, and the fund covers ${e(-eqX)} more.` : `${gap ? `The gap took the price past your liquidation price (${liqP.toFixed(2)} ETH)` : `Liquidated at ${liqP.toFixed(2)} ETH on the way down`}. In Perpetual Protocol v1 a full liquidation sends the remaining margin to the liquidator and the fund, so you get nothing back.`)
          : `Liquidation price ${liqP.toFixed(2)} ETH; the price ends at ${P1.toFixed(2)}.`
      };
    }
    roles.push(trader(1), trader(-1));
    const fSteps = [['Funding for one day', r.fundDay]];
    if (r.trigger) fSteps.push(['Forced repeg', -r.repegCost]);
    fSteps.push(['Remaining margin from crash liquidations', c.toFund], ['Bad debt from the crash', -c.bad]);
    const fRaw = st.fund + fSteps.reduce((a, s) => a + s[1], 0);
    if (fRaw < 0) fSteps.push(['Shortfall nobody covers (falls on traders in profit)', -fRaw]);
    const fEnd = Math.max(0, fRaw);
    roles.push({ key: 'fund', name: 'Insurance fund', unit: 'eth', start: st.fund, who: 'Built from trading fees; pays bad debt, repeg costs, and funding imbalances.', steps: fSteps, end: fEnd,
      verdict: fRaw < 0 ? `The fund is wiped out, and ${e(-fRaw)} of losses are left with nobody to pay them. Traders in profit, like the short above, can’t be paid in full.` : fEnd < st.fund ? `The fund shrinks by ${e(st.fund - fEnd)}.` : `The fund grows by ${e(fEnd - st.fund)}.` });
    roles.push({ key: 'liquidator', name: 'Liquidation bot', unit: 'eth', start: 0, who: 'Calls liquidate() on unhealthy positions for half the 1.25% fee.', steps: [['Fees from crash liquidations', c.toLiq]], end: c.toLiq,
      verdict: c.liquidated ? `Liquidates ${c.liquidated} traders${c.underwater ? `; ${c.underwater} were already underwater and paid no fee` : ''}.` : 'No positions to liquidate.' });
    const mevProfit = r.trigger ? A * L * r.mevPct : 0;
    roles.push({ key: 'mev', name: 'Same-block repeg trader', unit: 'eth', start: A, who: `Uses ${e(A)} at ${L}× around a pending forced repeg.`, steps: r.trigger ? [['Open, trigger payFunding(), close', mevProfit]] : [], end: A + mevProfit,
      verdict: r.trigger ? `About ${pct(r.mevPct, 1)} of the notional, risk-free in one transaction, paid by other traders and the fund.` : 'No forced repeg is due, so there is no same-block trade.' });
    return roles;
  }

  // ---------- Liquid staking ----------
  function lst(st, model, you) {
    const { r } = model, A = you.yAmount, d = st.discount, b = st.bonus, s = v => money('tkn', v);
    const roles = [];
    roles.push({ key: 'sell', name: 'LST holder, sells today', unit: 'tkn', start: A, who: `Stakes ${s(A)} for ${(A / r.rate).toFixed(2)} LST, then needs to exit now.`,
      steps: [[`Market discount of ${pct(d, 1)}`, -A * d]], end: A * (1 - d), verdict: d > 0 ? `Selling now costs ${s(A * d)}. Redeeming avoids that but takes ${st.wait} day${st.wait > 1 ? 's' : ''}.` : 'At peg, selling costs nothing beyond slippage.' });
    const wr = Math.pow(1 + st.apr / 365, st.wait) - 1;
    roles.push({ key: 'redeem', name: 'LST holder, redeems', unit: 'tkn', start: A, who: `Same position, but waits ${st.wait} day${st.wait > 1 ? 's' : ''} to redeem for TKN.`,
      steps: [['Staking rewards during the wait', A * wr]], end: A * (1 + wr), verdict: 'Full value back, at the cost of having the TKN locked for the wait.' });
    const lev = r.lev, mk = st.oracle === 'market';
    let C = A * lev * (1 - d), D = A * (lev - 1), pen = 0, liq = false;
    if (mk && D > 0) {
      for (let i = 0; i < 300 && C * st.lt < D; i++) { const R = Math.min(0.5 * D, C / (1 + b)); if (R < 1e-12) break; C -= R * (1 + b); D -= R; pen += R * b; liq = true; }
    }
    const loopSteps = [[`Depeg on ${lev.toFixed(2)}× exposure (at market price)`, -A * lev * d]];
    if (liq) loopSteps.push(['Liquidation bonus paid', -pen]);
    roles.push({ key: 'looper', name: `Looper ${lev.toFixed(2)}×`, unit: 'tkn', start: A, who: `Deposits ${s(A)} and loops ${st.loops} time${st.loops === 1 ? '' : 's'} at ${pct(st.ltv, 0)} LTV. Shown at market value today.`,
      steps: loopSteps, end: C - D,
      verdict: (mk ? (liq ? `The market-price oracle marked the position down and liquidators took ${s(pen)} in bonuses.` : `Not liquidated yet; that happens past a ${pct(r.loopLiqDiscount, 1)} discount.`) : 'The redemption-rate oracle never marks the position down, so it isn’t liquidated, and it’s worth the full amount at redemption value.') + ` In a normal year, looping earns ${pct(r.netApr, 2)}.` });
    roles.push({ key: 'arb', name: 'Arbitrageur', unit: 'tkn', start: A, who: `Buys LST on the market with ${s(A)} and redeems it.`, steps: [['Discount captured', (A * d) / (1 - d)]], end: A / (1 - d),
      verdict: d > 0 ? `${pct(d / (1 - d), 2)} over ${st.wait} day${st.wait > 1 ? 's' : ''}, ${r.arbAnnual > 10 ? 'over 1,000%' : pct(r.arbAnnual, 0)} a year. This trade is what pulls the price back to peg.` : 'No discount, no trade.' });
    roles.push({ key: 'liq', name: 'Liquidator', unit: 'tkn', start: A, who: `Repays ${s(A)} of a borrower’s TKN debt and sells the seized LST.`, steps: [['Bonus minus discount and slippage', A * r.liqProfit]], end: A * (1 + r.liqProfit),
      verdict: r.liqProfit < 0 ? 'A loss on every liquidation, so liquidators stay away and unhealthy loans pile up.' : 'Profitable, so unhealthy loans get cleared.' });
    roles.push({ key: 'tkn', name: 'Just holds TKN', unit: 'tkn', start: A, who: `Keeps ${s(A)} unstaked.`, steps: [], end: A, verdict: 'No yield and no depeg risk.' });
    return roles;
  }

  // ---------- Oracles ----------
  function oracle(st, model, you) {
    const { o, fa } = model, A = you.yAmount, pool = you.yPool, $ = v => money('usd', v);
    const roles = [];
    const spot = st.aSource === 'spot', borrow = spot ? fa.spotBorrow : fa.twapBorrow, prof = spot ? fa.spotProfit : fa.twapProfit;
    const hole = prof > 0 ? Math.max(0, Math.min(borrow, pool) - st.aColl) : 0;
    const loss = Math.min(A, (hole / pool) * A);
    roles.push({ key: 'lender', name: 'Lender, DEX-priced market', unit: 'usd', start: A, who: `Deposits ${$(A)} in a ${$(pool)} lending market that prices collateral from a DEX ${spot ? 'spot price' : 'TWAP'}.`,
      steps: [['Share of the hole the attacker leaves', -loss]], end: A - loss, verdict: prof > 0 ? `The attacker borrows ${$(Math.min(borrow, pool))} against collateral really worth ${$(st.aColl)} and leaves. Lenders share the ${$(hole)} difference.` : 'The attack doesn’t pay, so nothing is taken.' });
    roles.push({ key: 'attacker', name: 'Flash-loan attacker', unit: 'usd', start: st.aColl, who: `Posts ${$(st.aColl)} of the token as collateral and borrows ${$(st.aLoan)} in a flash loan.`,
      steps: prof > 0 ? [['Borrowed against the pumped price, minus costs, collateral abandoned', prof]] : [], end: st.aColl + Math.max(0, prof),
      verdict: prof > 0 ? 'All in one transaction: pump, borrow, repay the flash loan, walk away.' : 'Not profitable, so a rational attacker doesn’t try.' });
    const P0 = 2, coll = A / P0, D = A * (1 - st.trigger) * 0.8;
    const endPrice = o.truth[o.T];
    if (o.tTrue < 0) {
      roles.push({ key: 'borrower', name: 'Borrower near the trigger', unit: 'usd', start: A, who: `Posts ${$(A)} of TKN, borrowed so the loan hits health factor 1 after a ${pct(st.trigger, 0)} drop.`, steps: [['TKN price change over four hours', A * (endPrice / P0 - 1)]], end: A * endPrice / P0, verdict: 'The market never reached your liquidation price.' });
      roles.push({ key: 'liq', name: 'Liquidator', unit: 'usd', start: A, who: `Holds ${$(A)} to liquidate that loan.`, steps: [], end: A, verdict: 'Nothing to liquidate.' });
    } else if (o.tProt < 0) {
      roles.push({ key: 'borrower', name: 'Borrower near the trigger', unit: 'usd', start: A, who: `Posts ${$(A)} of TKN, borrowed so the loan hits health factor 1 after a ${pct(st.trigger, 0)} drop.`, steps: [['TKN price change over four hours', A * (endPrice / P0 - 1)]], end: A * endPrice / P0,
        verdict: `The market crossed your liquidation price at minute ${o.tTrue}, but the protocol never liquidated you. The loan keeps sinking and lenders carry the risk.` });
      roles.push({ key: 'liq', name: 'Liquidator', unit: 'usd', start: A, who: `Holds ${$(A)} to liquidate that loan.`, steps: [], end: A, verdict: 'The protocol never accepted a price low enough to allow a liquidation.' });
    } else {
      const pp = o.source[o.tProt], m = o.truth[o.tProt], R = 0.5 * D, seized = (R * 1.05) / pp;
      const end = (coll - seized) * m + R, fair = (coll - (R * 1.05) / m) * m + R;
      roles.push({ key: 'borrower', name: 'Borrower near the trigger', unit: 'usd', start: A, who: `Posts ${$(A)} of TKN, borrowed so the loan hits health factor 1 after a ${pct(st.trigger, 0)} drop. Bonus 5%, close factor 50%.`,
        steps: [[`TKN at $${m.toFixed(3)} when you’re liquidated (minute ${o.tProt})`, A * (m / P0 - 1)], [`Liquidation, priced at the protocol’s $${pp.toFixed(3)}`, end - (A * m) / P0]], end,
        verdict: (o.tProt - o.tTrue > 2 ? `Liquidated at minute ${o.tProt}, ${o.tProt - o.tTrue} minutes after the market crossed your liquidation price. ` : '') + (pp > m * 1.001 ? `The protocol valued your TKN above the market, so liquidators took fewer TKN than a fair liquidation would: you keep ${$(end - fair)} more. Liquidators and lenders carry that.` : 'The protocol price matched the market at that moment, so the liquidation itself was fair.') });
      const lp = A * ((1.05 * m) / pp - 1);
      roles.push({ key: 'liq', name: 'Liquidator', unit: 'usd', start: A, who: `Repays ${$(A)} of that kind of debt at minute ${o.tProt}.`, steps: [['Bonus, minus the gap between protocol and market price', lp]], end: A + lp,
        verdict: lp < 0 ? `The protocol price sits ${pct(pp / m - 1, 1)} above the market, more than the 5% bonus. Rational liquidators wait, and loans go bad in the meantime.` : `The protocol price is close enough to the market that the bonus still pays.` });
    }
    return roles;
  }

  // ---------- Vault ----------
  function vault(st, model, you) {
    const A = you.yAmount, u = x => BigInt(Math.round(x * 1e6)), toN = b => Number(b) / 1e6, c = v => money('usdc', v);
    const run = S.vault({ A0: u(st.A0), S0: BigInt(Math.round(st.S0)), attDeposit: BigInt(Math.max(1, Math.round(st.att))), donation: u(st.donation), victim: u(A), defense: st.defense, offset: st.offset, roundUp: st.round === 'up' });
    const roles = [];
    const got = toN(run.a5);
    roles.push({ key: 'depositor', name: 'Depositor after the attacker', unit: 'usdc', start: A, who: `Deposits ${c(A)} right after the attacker’s setup, then redeems.`, steps: [['Rounding plus the attacker’s donation trick', got - A]], end: got,
      verdict: A <= 0 ? 'No deposit.' : run.s3 === 0n ? 'Your deposit minted zero shares. You own nothing in the vault.' : `Your deposit minted ${run.s3.toLocaleString('en-US')} raw shares and redeems for ${c(got)}.` });
    const spent = Math.max(1, Math.round(st.att)) / 1e6 + st.donation;
    roles.push({ key: 'attacker', name: 'Attacker', unit: 'usdc', start: spent, who: `Deposits ${Math.max(1, Math.round(st.att)).toLocaleString('en-US')} raw units and sends ${c(st.donation)} straight to the vault.`, steps: [['Redeemed minus spent', toN(run.a4) - spent]], end: toN(run.a4),
      verdict: toN(run.a4) > spent ? 'The attack pays.' : 'The attack costs more than it takes.' });
    const last = run.log[run.log.length - 1];
    if (st.A0 > 0 && st.S0 > 0 && last.vsh > 0n) {
      const val = (st.S0 * Number(last.vas)) / Number(last.vsh) / 1e6;
      roles.push({ key: 'existing', name: 'Earlier depositors', unit: 'usdc', start: st.A0, who: `Already held ${Math.round(st.S0).toLocaleString('en-US')} raw shares backed by ${c(st.A0)}.`, steps: [['Change in what their shares redeem for', val - st.A0]], end: val,
        verdict: val < st.A0 ? 'Their shares now redeem for less: someone took value from them.' : 'Their shares hold their value.' });
    }
    return roles;
  }

  return { lending, amm, perps, lst, oracle, vault, money, pct };
})();
if (typeof module !== 'undefined') module.exports = Roles;

</script>
<script>
(() => {
  const MINUS = '−';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const F = {
    usd(v) {
      const a = Math.abs(v), s = v < 0 ? MINUS : '';
      if (a >= 1e9) return s + '$' + (a / 1e9).toFixed(2) + 'B';
      if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(2) + 'M';
      if (a >= 1e3) return s + '$' + (a / 1e3).toFixed(1) + 'K';
      return s + '$' + a.toFixed(a < 10 ? 2 : 0);
    },
    pct(v, d = 1) { return (v < 0 ? MINUS : '') + Math.abs(v * 100).toFixed(d) + '%'; },
    spct(v, d = 1) { return (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v * 100).toFixed(d) + '%'; },
    eth(v, d = 2) { return (v < 0 ? MINUS : '') + Math.abs(v).toFixed(d) + ' ETH'; },
    seth(v, d = 2) { return (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v).toFixed(d) + ' ETH'; },
    int(v) { return Math.round(v).toLocaleString('en-US'); },
    usdc(v) { return v.toLocaleString('en-US', { maximumFractionDigits: v < 1 ? 6 : 2 }) + ' USDC'; },
    units(u) {
      const neg = u < 0n, a = neg ? -u : u;
      const whole = a / 1000000n, frac = (a % 1000000n).toString().padStart(6, '0').replace(/0+$/, '');
      return (neg ? MINUS : '') + whole.toLocaleString('en-US') + (frac ? '.' + frac : '') + ' USDC';
    }
  };

  // ---------- charts ----------
  function niceStep(range, n) {
    const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  }
  function niceMax(v) { if (!(v > 0)) return 1; const s = niceStep(v, 4); return Math.ceil((v * 1.08) / s) * s; }
  function ticks(min, max, n) {
    const s = niceStep(max - min, n), out = [];
    for (let v = Math.ceil(min / s - 1e-9) * s; v <= max + s * 1e-9; v += s) out.push(+v.toFixed(12));
    return out;
  }
  function cssv(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888'; }
  function drawChart(cv, spec) {
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const mono = cssv('--font-mono');
    g.font = '11px ' + mono;
    const X = spec.x, Y = spec.y;
    const yt = ticks(Y.min, Y.max, 4);
    const yLabels = yt.map(Y.fmt);
    const lw = Math.max(...yLabels.map(s => g.measureText(s).width));
    const pad = { l: Math.ceil(lw) + 12, r: 12, t: 14, b: X.label ? 44 : 30 };
    const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const xv = v => (X.log ? Math.log10(v) : v);
    const x0 = xv(X.min), x1 = xv(X.max);
    const px = v => pad.l + ((xv(v) - x0) / (x1 - x0)) * pw;
    const py = v => pad.t + (1 - (v - Y.min) / (Y.max - Y.min)) * ph;
    const line = cssv('--line'), muted = cssv('--muted');
    // bands
    for (const b of spec.bands || []) {
      g.fillStyle = cssv(b.color);
      g.fillRect(px(b.x0), pad.t, Math.max(1, px(b.x1) - px(b.x0)), ph);
    }
    // grid + y labels
    g.strokeStyle = line; g.lineWidth = 1; g.fillStyle = muted; g.textBaseline = 'middle'; g.textAlign = 'right';
    yt.forEach((v, i) => {
      const y = Math.round(py(v)) + 0.5;
      g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
      g.fillText(yLabels[i], pad.l - 6, y);
    });
    // x ticks
    let xt;
    if (X.log) { xt = []; for (let e = Math.ceil(x0 - 1e-9); e <= x1 + 1e-9; e++) xt.push(Math.pow(10, e)); }
    else xt = ticks(X.min, X.max, Math.max(3, Math.min(8, Math.floor(pw / 70))));
    g.textAlign = 'center'; g.textBaseline = 'top';
    xt.forEach(v => { const x = px(v); g.fillText(X.fmt(v), x, pad.t + ph + 7); g.beginPath(); g.moveTo(Math.round(x) + 0.5, pad.t + ph); g.lineTo(Math.round(x) + 0.5, pad.t + ph + 4); g.stroke(); });
    if (X.label) { g.font = '12px ' + cssv('--font-body'); g.textAlign = 'right'; g.fillText(X.label, w - pad.r, pad.t + ph + 26); g.font = '11px ' + mono; }
    g.save();
    g.beginPath(); g.rect(pad.l, pad.t - 2, pw, ph + 4); g.clip();
    for (const hl of spec.hlines || []) {
      g.strokeStyle = cssv(hl.color); g.lineWidth = 1.5; g.setLineDash(hl.dash ? [5, 4] : []);
      const y = py(hl.y); g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
    }
    for (const s of spec.series) {
      const pts = s.pts.filter(p => isFinite(p[0]) && isFinite(p[1]));
      if (!pts.length) continue;
      const c = cssv(s.color);
      g.setLineDash(s.dash ? [6, 4] : []);
      g.lineWidth = s.width || 2; g.strokeStyle = c; g.lineJoin = 'round';
      g.beginPath();
      pts.forEach((p, i) => {
        const x = px(p[0]), y = py(clamp(p[1], Y.min - (Y.max - Y.min), Y.max * 2));
        if (i === 0) g.moveTo(x, y);
        else if (s.step) { g.lineTo(x, py(pts[i - 1][1])); g.lineTo(x, y); }
        else g.lineTo(x, y);
      });
      g.stroke();
      if (s.fill) {
        g.lineTo(px(pts[pts.length - 1][0]), py(Math.max(Y.min, 0))); g.lineTo(px(pts[0][0]), py(Math.max(Y.min, 0))); g.closePath();
        g.globalAlpha = 0.14; g.fillStyle = c; g.fill(); g.globalAlpha = 1;
      }
    }
    g.setLineDash([]);
    g.restore();
    for (const vl of spec.vlines || []) {
      if (vl.x < X.min || vl.x > X.max) continue;
      const x = Math.round(px(vl.x)) + 0.5;
      g.strokeStyle = cssv(vl.color); g.lineWidth = 1.5; g.setLineDash(vl.dash ? [4, 3] : []);
      g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, pad.t + ph); g.stroke(); g.setLineDash([]);
      if (vl.label) {
        g.fillStyle = cssv(vl.color); g.textBaseline = 'top';
        const tw = g.measureText(vl.label).width;
        const right = x + 5 + tw < w - pad.r;
        g.textAlign = right ? 'left' : 'right';
        g.fillText(vl.label, right ? x + 5 : x - 5, pad.t + (vl.row || 0) * 14);
      }
    }
    for (const p of spec.points || []) {
      if (!isFinite(p.y)) continue;
      g.fillStyle = cssv(p.color); g.strokeStyle = cssv('--surface'); g.lineWidth = 2;
      g.beginPath(); g.arc(px(p.x), py(clamp(p.y, Y.min, Y.max)), 4.5, 0, Math.PI * 2); g.fill(); g.stroke();
    }
  }

  function monitor(rows) {
    const c = { ok: 0, warn: 0, crit: 0 };
    rows.forEach(r => c[r.lv]++);
    const sum = [c.crit ? c.crit + ' critical' : '', c.warn ? c.warn + (c.warn > 1 ? ' warnings' : ' warning') : '', c.ok ? c.ok + ' OK' : ''].filter(Boolean).join(' · ');
    const sorted = rows.map((r, i) => [r, i]).sort((a, b) => RANK[a[0].lv] - RANK[b[0].lv] || a[1] - b[1]).map(x => x[0]);
    return `<section class="panel" aria-label="Monitors"><h3>Monitors <small>${sum}</small></h3><div class="mon">${sorted.map(r =>
      `<div class="mon-row ${r.lv}"><span class="pill">${LV[r.lv]}</span><div><div class="t">${r.t}${r.ref ? `<span class="ref">${r.ref}</span>` : ''}</div><p class="d">${r.d}</p></div></div>`).join('')}</div></section>`;
  }
  function worst(rows) { return rows.reduce((w, r) => (RANK[r.lv] < RANK[w] ? r.lv : w), 'ok'); }
  function metrics(items) {
    return `<section class="metrics" aria-label="Readouts">${items.map(m => `<div class="m"><div class="l">${m.l}</div><div class="v ${m.cls || ''}">${m.v}</div>${m.s ? `<div class="s">${m.s}</div>` : ''}</div>`).join('')}</section>`;
  }

  }
  function notes(items) {

    ],
    presets: [
      { name: 'Healthy feed', note: '<b>Start here.</b> A 20% crash over 6 minutes. The feed keeps up and liquidations fire close to when the market crosses the trigger. Watch the confidence band widen during the drop.', set: {} },
      { name: 'Outage in the crash', note: 'The feed goes silent 10 minutes before the crash. A 60-minute age limit still accepts the old $2.00 price, so the protocol keeps valuing collateral at pre-crash prices.', set: { outageLen: 40 } },
      { name: 'TWAP lag', note: 'A 60-minute TWAP resists manipulation but trails a real crash. Liquidations start long after the market moves.', set: { source: 'twap', twap: 60 } },
      { name: 'Confidence pause', note: 'A strict 1% confidence limit. It protects against bad prints, but it rejects prices in exactly the minutes when liquidations are needed.', set: { maxConf: 1 } },
      { name: 'Age check too strict', note: 'Rejecting prices older than 5 minutes with a 60-minute heartbeat: a quiet market looks stale and the protocol pauses for no reason.', set: { maxAge: 5 } },
      { name: 'Spot-price exploit', note: 'The bZx pattern (February 2020): a flash loan pumps a thin pool, the lending market reads that pool’s price, and the attacker borrows against the inflated collateral and walks away. Mango Markets (2022) worked the same way without a flash loan: about $10M of the attacker’s own USDC pumped thin markets and the oracle followed.', set: { aSource: 'spot' } },
      { name: 'TWAP defense', note: 'The same attack against a 30-minute TWAP: a pump held for one second barely moves the average.', set: { aSource: 'twap' } }
    ],
    render(st) {
      const o = Sim.oracle({ price0: 2, vol: st.vol, crash: st.crash, crashAt: st.crashAt, crashLen: st.crashLen, deviation: st.deviation, heartbeat: st.heartbeat, outageAt: st.outageAt, outageLen: st.outageLen, twap: st.twap, maxAge: st.maxAge, maxConf: st.maxConf, source: st.source, trigger: st.trigger, seed: st.seed });
      const fa = Sim.flashAttack({ depth: st.aDepth, loan: st.aLoan, coll: st.aColl, ltv: st.aLtv, fee: 0.003, loanFee: 0.0009, hold: st.aHold, twapWin: st.twap });
      const srcName = st.source === 'twap' ? 'TWAP' : 'oracle price';
      const cw0 = st.crashAt, cw1 = st.crashAt + st.crashLen + 10;
      let staleInCrash = false, pausedInCrash = 0;
      for (let t = cw0; t <= Math.min(o.T, cw1); t++) { if (o.age[t] > st.maxAge) staleInCrash = true; if (!o.accepted[t]) pausedInCrash++; }
      const rows = [];
      if (o.staleMin === 0) rows.push({ lv: 'ok', t: 'Freshness', d: `Every price was under ${st.maxAge} minutes old when the protocol read it.` });
      else rows.push({ lv: staleInCrash ? 'crit' : 'warn', t: 'Stale prices', d: `Prices were older than ${st.maxAge} minutes for ${o.staleMin} minutes${staleInCrash ? ', including during the crash' : ''}. The protocol couldn’t act on them.` });
      if (st.maxAge < st.heartbeat) rows.push({ lv: 'warn', t: 'Age limit shorter than the heartbeat', d: `The feed only has to update every ${st.heartbeat} minutes in a calm market, but the protocol rejects anything older than ${st.maxAge}. Quiet markets look stale.` });
      if (st.outageLen > 0 && st.maxAge >= st.outageLen) rows.push({ lv: 'crit', t: 'Outage hidden by a loose age limit', ref: 'Stale feed', d: `The feed was silent for ${st.outageLen} minutes, but a ${st.maxAge}-minute limit still accepts its last price. A feed that can sit a day stale is a real risk.` });
      if (o.confMin === 0) rows.push({ lv: 'ok', t: 'Confidence', d: `The confidence interval stayed under ${F.pct(st.maxConf, 1)}.` });
      else rows.push({ lv: pausedInCrash > 0 ? 'warn' : 'ok', t: 'Confidence too wide', d: `For ${o.confMin} minutes, mostly around the crash, the confidence interval was wider than ${F.pct(st.maxConf, 1)}. Rejecting those prices is safe, but it pauses liquidations exactly when they’re needed.` });
      rows.push({ lv: o.maxDev < 0.02 ? 'ok' : o.maxDev < 0.08 ? 'warn' : 'crit', t: 'Price error', d: `The ${srcName} was off from the market by up to ${F.pct(o.maxDev, 1)}, at minute ${o.maxDevT}.` });
      if (o.tTrue < 0) rows.push({ lv: 'ok', t: 'Liquidation timing', d: `The market never fell ${F.pct(st.trigger, 0)} in these four hours.` });
      else if (o.tProt < 0) rows.push({ lv: 'crit', t: 'Liquidations never fire', d: `The market crossed the ${MINUS}${F.pct(st.trigger, 0)} trigger at minute ${o.tTrue}, but the protocol never saw an accepted price below it.` });
      else { const dl = o.tProt - o.tTrue; rows.push({ lv: dl <= 2 ? 'ok' : dl <= 10 ? 'warn' : 'crit', t: 'Liquidation timing', d: dl <= 0 ? `Liquidations fire at minute ${o.tProt}, as soon as the market crosses the trigger.` : `The market crossed the trigger at minute ${o.tTrue}; the protocol acts at minute ${o.tProt}, ${dl} minute${dl > 1 ? 's' : ''} late.` }); }
      const spot = st.aSource === 'spot';
      const prof = spot ? fa.spotProfit : fa.twapProfit, mult = spot ? fa.m : fa.twapM;
      rows.push(prof > 0
        ? { lv: 'crit', t: 'Flash-loan attack is profitable', ref: 'bZx 2020', d: `Borrow ${F.usd(st.aLoan)} in a flash loan, push the pool price ×${mult.toFixed(2)}, borrow ${F.usd(spot ? fa.spotBorrow : fa.twapBorrow)} against ${F.usd(st.aColl)} of collateral, repay the loan, and keep ${F.usd(prof)}.` }
        : { lv: 'ok', t: 'Flash-loan attack fails', ref: 'bZx 2020', d: `The ${spot ? 'spot price' : 'TWAP'} only moves ×${mult.toFixed(spot ? 2 : 4)}, so borrowing against the pumped price is worth less than the collateral left behind.${spot ? ` Break-even needs a loan of about ${F.usd(fa.loanNeeded)}.` : ''}` });
      // chart
      const pts = k => o[k].map((v, t) => [t, v]);
      const bands = [];
      let s0 = -1;
      for (let t = 0; t <= o.T + 1; t++) {
        const bad = t <= o.T && !o.accepted[t];
        if (bad && s0 < 0) s0 = t;
        if (!bad && s0 >= 0) { bands.push({ x0: s0, x1: t, color: '--crit-soft' }); s0 = -1; }
      }
      const all = o.truth.concat(o.reported, o.twap);
      const lo = Math.min(...all, o.level), hi = Math.max(...all);
      const vl = [];
      if (o.tTrue >= 0) vl.push({ x: o.tTrue, color: '--ink', dash: true, label: 'market hits trigger', row: 0 });
      if (o.tProt >= 0 && o.tProt !== o.tTrue) vl.push({ x: o.tProt, color: '--accent', dash: true, label: 'protocol acts', row: 1 });
      const charts = [{ id: 'c-orc', spec: { x: { min: 0, max: o.T, fmt: v => v + 'm', label: 'Minutes' }, y: { min: Math.floor(lo * 0.97 * 20) / 20, max: Math.ceil(hi * 1.02 * 20) / 20, fmt: v => '$' + v.toFixed(2) },
        bands, series: [{ pts: pts('truth'), color: '--faint', width: 1.5 }, { pts: pts('reported'), color: '--accent', step: true }, { pts: pts('twap'), color: '--warm', dash: true }],
        hlines: [{ y: o.level, color: '--muted', dash: true }], vlines: vl } }];
      const tb = Math.min(o.T, st.crashAt + st.crashLen);
      const lag = (o.twap[tb] - o.truth[tb]) / o.truth[tb];
      const html = monitor(rows) + metrics([
        { l: 'Minutes paused', v: String(o.pausedMin), s: `${o.staleMin} stale · ${o.confMin} wide confidence` },
        { l: 'Largest price error', v: F.pct(o.maxDev, 1), s: srcName + ' vs market', cls: o.maxDev >= 0.08 ? 'bad' : '' },
        { l: 'Liquidation delay', v: o.tTrue < 0 ? 'No trigger' : o.tProt < 0 ? 'Never' : Math.max(0, o.tProt - o.tTrue) + ' min', cls: o.tTrue >= 0 && (o.tProt < 0 || o.tProt - o.tTrue > 10) ? 'bad' : '' },
        { l: 'TWAP lag at the bottom', v: F.spct(lag, 1), s: `${st.twap}-minute window, minute ${tb}` },
        { l: 'Pumped spot price', v: '×' + fa.m.toFixed(2), s: 'after the flash-loan buy' },
        { l: 'TWAP moves', v: '×' + fa.twapM.toFixed(4), s: `held ${st.aHold < 60 ? Math.round(st.aHold) + ' s' : (st.aHold / 60).toFixed(1) + ' min'} of ${st.twap} min` },
        { l: 'Attacker’s profit', v: F.usd(Math.max(0, prof)), s: spot ? 'market reads spot' : 'market reads TWAP', cls: prof > 0 ? 'bad' : 'good' }
      ]) + chartPanel('c-orc', 'Four hours of TKN price', 'shaded minutes: the protocol rejected the price', [{ label: 'Market', color: '--faint' }, { label: 'Oracle reported', color: '--accent' }, { label: `TWAP (${st.twap} min)`, color: '--warm', dash: true }, { label: 'Liquidation trigger', color: '--muted', dash: true }, { label: 'Rejected', color: '--crit-soft', band: true }]) + notes([
        'Market price: a random walk with the chosen per-minute volatility, plus a crash spread evenly over its duration. The path is seeded so runs repeat; the button draws a new one.',
        'Feed: pushes a new price when the market moves more than the deviation threshold or the heartbeat runs out, and nothing during an outage. Confidence widens with recent volatility, like a Pyth confidence interval.',
        'Protocol: rejects prices older than the age limit or with confidence wider than the limit. A rejected minute means no liquidations that minute.',
        'TWAP: the average of the reported price over the window. Feeding an oracle that is itself a TWAP into another TWAP slows it twice.',
        'Flash-loan attack: buying with the loan multiplies a constant-product pool’s spot price by (1 + loan ÷ depth)². A TWAP moves by that jump × (time held ÷ window). Costs: the swap fee both ways plus a 0.09% flash-loan fee. The attacker abandons the collateral and keeps the borrowed funds.'
      ]);
      return { html, charts, level: worst(rows), model: { o, fa } };
    },
    renderUsers(st, m) { return usersView(this, Roles.oracle(st, m, st)); }
  });

  // ===== Vault =====
  LABS.push({
    key: 'vault', name: 'Vault shares',
    title: 'Vault share accounting (ERC-4626)',
    blurb: 'A USDC vault that mints shares on deposit, with exact integer math as on-chain. Run the first-depositor inflation attack, turn on a defense, or flip the rounding direction.',
    you: [
      { id: 'yAmount', label: 'Your deposit', type: 'log', min: 1, max: 10e6, value: 10000, fmt: v => F.usdc(v) }
    ],

    ],
    controls: [
      { grp: 'Vault before the attack (USDC, 6 decimals)' },
      { id: 'A0', label: 'USDC already deposited', type: 'log', zero: true, min: 1, max: 10e6, value: 0, fmt: v => (v === 0 ? 'Empty' : F.usdc(v)) },
      { id: 'S0', label: 'Shares already minted (raw units)', type: 'log', zero: true, min: 1, max: 1e13, value: 0, fmt: v => (v === 0 ? 'None' : F.int(v)) },

      { id: 'att', label: 'Attacker’s first deposit (raw units)', type: 'log', min: 1, max: 1e9, value: 1, fmt: v => F.int(v) + ' = ' + F.usdc(Math.round(v) / 1e6) },
      { id: 'donation', label: 'Attacker sends directly to the vault', type: 'log', zero: true, min: 1, max: 10e6, value: 10000, fmt: v => (v === 0 ? 'Nothing' : F.usdc(v)) },
      { id: 'victim', label: 'Victim deposits', type: 'log', zero: true, min: 1, max: 10e6, value: 10000, fmt: v => (v === 0 ? 'Nothing' : F.usdc(v)) },
      { grp: 'Vault code' },
      { id: 'defense', label: 'Share math', type: 'seg', options: [['none', 'Naive'], ['offset', 'Virtual offset']], value: 'none' },
      { id: 'offset', label: 'Virtual offset (extra share decimals)', min: 0, max: 9, step: 1, value: 3, fmt: v => String(v) },
      { id: 'round', label: 'Deposit rounds shares', type: 'seg', options: [['down', 'Down (correct)'], ['up', 'Up (bug)']], value: 'down' }
    ],
    presets: [
      { name: 'Inflation attack', note: '<b>Start here.</b> An empty vault. The attacker deposits 1 raw unit, sends 10,000 USDC straight to the vault, and the victim’s 10,000 USDC deposit rounds down to 0 shares.', set: {} },
      { name: 'OpenZeppelin defense', note: 'Virtual shares and assets with offset 3. The same attack now costs the attacker about half the donation, and the victim loses dust.', set: { defense: 'offset', offset: 3 } },
      { name: 'Offset 0', note: 'Offset 0 already makes the attack unprofitable, but the victim still loses a third. The attack turns into pure griefing.', set: { defense: 'offset', offset: 0 } },
      { name: 'Rounding-up bug', note: 'A busy vault where one share is worth 1,000 USDC. Rounding up on deposit mints a whole share for 1 raw unit. This is what a share-price invariant catches.', set: { A0: 1e6, S0: 1000, att: 1, donation: 0, victim: 0, round: 'up' } }
    ],
    render(st) {
      const u = x => BigInt(Math.round(x * 1e6));
      const r = Sim.vault({ A0: u(st.A0), S0: BigInt(Math.round(st.S0)), attDeposit: BigInt(Math.max(1, Math.round(st.att))), donation: u(st.donation), victim: u(st.victim), defense: st.defense, offset: st.offset, roundUp: st.round === 'up' });
      const victimU = u(st.victim);
      const rows = [];
      if (victimU > 0n) {
        rows.push(r.victimShares === 0n
          ? { lv: 'crit', t: 'Victim got zero shares', d: `Their ${F.units(victimU)} deposit × shares ÷ assets rounded down to 0. The money is now owned by the attacker’s share.` }
          : { lv: 'ok', t: 'Victim got shares', d: `Their deposit minted ${r.victimShares.toLocaleString('en-US')} raw shares.` });
        const lossPct = Number(r.victimLoss) / Number(victimU);
        rows.push({ lv: lossPct <= 0.0001 ? 'ok' : lossPct <= 0.01 ? 'warn' : 'crit', t: 'Victim’s loss', d: `They put in ${F.units(victimU)} and got back ${F.units(r.a5)}: ${F.units(r.victimLoss)} lost (${(lossPct * 100).toFixed(lossPct < 0.001 ? 4 : 2)}%).` });
      }
      rows.push(r.attProfit > 0n
        ? { lv: 'crit', t: 'Attacker profits', d: `Spent ${F.units(BigInt(Math.round(st.att)) + u(st.donation))}, redeemed ${F.units(r.a4)}: ${F.units(r.attProfit)} profit.` }
        : { lv: 'ok', t: 'Attack doesn’t pay', d: `The attacker spent ${F.units(BigInt(Math.round(st.att)) + u(st.donation))} and redeemed ${F.units(r.a4)}: a ${F.units(-r.attProfit)} loss.` });
      const failed = r.log.filter(x => x.check === 'fail');
      rows.push(failed.length
        ? { lv: 'crit', t: 'Share price fell', ref: 'Share-price invariant', d: `Step ${failed.map(x => x.step).join(', ')} lowered the value of a share. The spec <code>new_shares × old_assets ≤ old_shares × new_assets</code> rejects this code.` }
        : { lv: 'ok', t: 'Share price never fell', ref: 'Share-price invariant', d: 'Every deposit and redeem kept <code>new_shares × old_assets ≤ old_shares × new_assets</code>.' });
      if (r.leftover > 0n) rows.push({ lv: 'ok', t: 'Left in the vault', d: `${F.units(r.leftover)} stays behind after everyone redeems${st.defense === 'offset' ? ', owned by the virtual shares' : ''}.` });
      const price = x => { if (x.vsh === 0n) return '—'; const v = Number(x.vas) / Number(x.vsh); return v >= 1e4 ? v.toExponential(3) : v.toPrecision(5); };
      const table = `<section class="panel"><h3>Step by step <small>raw integer state after each step</small></h3><div class="tbl-wrap"><table class="log"><thead><tr><th>Step</th><th>Action</th><th class="n">Total assets</th><th class="n">Total shares (raw)</th><th class="n">Assets per share (raw)</th><th>Price check</th></tr></thead><tbody>${r.log.map(x =>
        `<tr><td>${x.step}</td><td>${x.action}</td><td class="n">${F.units(x.A)}</td><td class="n">${x.S.toLocaleString('en-US')}</td><td class="n">${price(x)}</td><td>${x.check === 'pass' ? '<span class="tag pass">Pass</span>' : x.check === 'fail' ? '<span class="tag fail">Fail</span>' : ''}</td></tr>`).join('')}</tbody></table></div></section>`;
      const html = monitor(rows) + metrics([

        'A direct transfer (the “donation”) raises total assets without minting shares, which is what inflates the share price.',
        'The price check is a share-price invariant, cross-multiplied to avoid division: after a deposit or redeem, new_shares × old_assets ≤ old_shares × new_assets.'

    renderUsers(st, m) { return usersView(this, Roles.vault(st, m, st)); }
  });


  // ---------- Users view ----------
  function usersView(lab, roles) {
    let sel = roles.find(x => x.key === lab.role) || roles[0];
    lab.role = sel.key;
    const M = Roles.money;
    const sm = (u, v) => (v > 1e-12 ? '+' : '') + M(u, Math.abs(v) < 1e-12 ? 0 : v);
    const cls = v => (v > 1e-9 ? 'gain' : v < -1e-9 ? 'loss' : '');
    const plp = x => (x.start > 0 ? (x.end - x.start) / x.start : null);
    const p = sel.end - sel.start, pp = plp(sel);
    const ledger = `<table class="ledger"><tbody><tr class="base"><td>Puts in</td><td class="n">${M(sel.unit, sel.start)}</td></tr>${sel.steps.map(st =>
      st[2] === 'info' ? `<tr class="info"><td>${st[0]}</td><td class="n">${M(sel.unit, st[1])}</td></tr>` : `<tr><td>${st[0]}</td><td class="n ${cls(st[1])}">${sm(sel.unit, st[1])}</td></tr>`).join('')}<tr class="total"><td>Ends with</td><td class="n">${M(sel.unit, sel.end)}</td></tr></tbody></table>`;
    const you = `<section class="panel"><h3>Your money <small>pick who you are</small></h3><div class="roles">${roles.map(x =>
      `<button type="button" class="chip" data-role="${x.key}" aria-pressed="${x === sel}">${x.name}</button>`).join('')}</div><div class="story"><p class="who">${sel.who}</p><div class="result ${cls(p)}"><span class="big">${sm(sel.unit, p)}</span>${pp !== null ? `<span class="pp">${F.spct(pp, 1)}</span>` : ''}</div>${ledger}<p class="verdict">${sel.verdict}</p></div></section>`;
    const maxAbs = Math.max(0.05, ...roles.map(plp).filter(v => v !== null).map(Math.abs));
    const everyone = `<section class="panel"><h3>Everyone in this scenario <small>same amount for every role</small></h3><div class="tbl-wrap"><table class="log everyone"><thead><tr><th>Role</th><th class="n">Puts in</th><th class="n">Ends with</th><th class="n">Profit or loss</th><th>Return</th></tr></thead><tbody>${roles.map(x => {
      const v = plp(x), d = x.end - x.start, w = v === null ? 0 : (Math.min(Math.abs(v), maxAbs) / maxAbs) * 50;
      return `<tr${x === sel ? ' class="sel"' : ''}><td><button type="button" class="rolebtn" data-role="${x.key}">${x.name}</button></td><td class="n">${M(x.unit, x.start)}</td><td class="n">${M(x.unit, x.end)}</td><td class="n ${cls(d)}">${sm(x.unit, d)}</td><td class="ret"><span class="bar"><i class="${v !== null && v < 0 ? 'neg' : 'pos'}" style="width:${w.toFixed(1)}%"></i></span><span class="n ${cls(d)}">${v === null ? '—' : F.spct(v, 1)}</span></td></tr>`;
    }).join('')}</tbody></table></div></section>`;
    return you + everyone + notes(lab.youNotes);
  }

  // ---------- control plumbing ----------
  function logPos(c, v) {
    if (c.zero && v <= 0) return 0;
    const f = Math.log(v / c.min) / Math.log(c.max / c.min);
    return c.zero ? Math.round(1 + f * 999) : Math.round(f * 1000);
  }
  function logVal(c, p) {
    if (c.zero && p <= 0) return 0;
    const f = c.zero ? (p - 1) / 999 : p / 1000;
    const v = c.min * Math.pow(c.max / c.min, f);
    const e = Math.pow(10, Math.floor(Math.log10(v)) - 2);
    return Math.round(v / e) * e;
  }
  function ctlHTML(lab, c) {
    if (c.grp) return `<h3 class="grp">${c.grp}</h3>`;
    const id = lab.key + '-' + c.id;
    if (c.type === 'seg') return `<div class="ctl"><div class="ctl-top"><span class="lbl" id="${id}-l">${c.label}</span></div><div class="seg" role="group" aria-labelledby="${id}-l">${c.options.map((o, i) => `<button type="button" id="${id}-${i}" data-ctl="${c.id}" data-i="${i}">${o[1]}</button>`).join('')}</div></div>`;
    if (c.type === 'button') return `<div class="ctl"><button type="button" class="btn" id="${id}" data-ctl="${c.id}">${c.label}</button></div>`;
    if (c.type === 'log') return `<div class="ctl"><div class="ctl-top"><label for="${id}">${c.label}</label><output id="${id}-o" for="${id}"></output></div><input type="range" id="${id}" data-ctl="${c.id}" min="0" max="1000" step="1"></div>`;
    return `<div class="ctl"><div class="ctl-top"><label for="${id}">${c.label}</label><output id="${id}-o" for="${id}"></output></div><input type="range" id="${id}" data-ctl="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}"></div>`;
  }
  function allCtl(lab) { return lab.you.concat(lab.controls); }
  function defaults(lab) {
    const d = {};
    allCtl(lab).forEach(c => { if (c.grp) return; d[c.id] = c.value; });
    return d;
  }
  function toState(lab) {
    const st = {};
    allCtl(lab).forEach(c => { if (c.grp) return; const v = lab.raw[c.id]; st[c.id] = (c.type || 'range') === 'range' ? v * (c.scale || 1) : v; });
    return st;
  }
  function syncControls(lab) {
    allCtl(lab).forEach(c => {
      if (c.grp || c.type === 'button') return;
      const id = lab.key + '-' + c.id, v = lab.raw[c.id];
      if (c.type === 'seg') { c.options.forEach((o, i) => { const b = document.getElementById(id + '-' + i); if (b) b.setAttribute('aria-pressed', String(o[0] === v)); }); return; }
      const inp = document.getElementById(id), out = document.getElementById(id + '-o');
      if (c.type === 'log') { inp.value = logPos(c, v); out.textContent = c.fmt(v); }
      else { inp.value = v; out.textContent = c.fmt(v); }
    });
  }
  function drawLabCharts(lab) {
    (lab.charts || []).forEach(ch => { const cv = document.getElementById(ch.id); if (cv) drawChart(cv, ch.spec); });
  }
  let view = 'eng';
  try { if (localStorage.getItem('defi-lab-view') === 'users') view = 'users'; } catch (e) {}
  function update(lab) {
    const st = toState(lab);
    const res = lab.render(st);
    if (view === 'users') { lab.out.innerHTML = lab.renderUsers(st, res.model); lab.charts = []; }
    else { lab.out.innerHTML = res.html; lab.charts = res.charts || []; drawLabCharts(lab); }
    const dot = document.getElementById('dot-' + lab.key);
    if (dot) { dot.className = 'dot ' + res.level; dot.title = LV[res.level]; }
    const tabLabel = document.getElementById('tab-' + lab.key);
    if (tabLabel) tabLabel.setAttribute('aria-label', lab.name + ', ' + LV[res.level]);
  }
  let rafs = {};
  function schedule(lab) {
    if (rafs[lab.key]) return;
    rafs[lab.key] = requestAnimationFrame(() => { rafs[lab.key] = 0; update(lab); });
  }
  function applyPreset(lab, i) {
    const p = lab.presets[i];
    const keep = {};
    if (lab.raw) lab.you.forEach(c => { keep[c.id] = lab.raw[c.id]; });
    lab.raw = Object.assign(defaults(lab), keep, p.set);
    lab.preset = i;
    syncControls(lab);
    lab.root.querySelectorAll('.presets .chip').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    lab.root.querySelector('.preset-note').innerHTML = p.note;
    update(lab);
  }
  function clearPreset(lab) {
    if (lab.preset === -1) return;
    lab.preset = -1;
    lab.root.querySelectorAll('.presets .chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
    lab.root.querySelector('.preset-note').innerHTML = '<b>Custom settings.</b> Pick a scenario above to reset this lab.';
  }

  // ---------- view switch ----------
  function setView(v, rerender) {
    view = v;
    document.body.classList.toggle('view-users', v === 'users');
    document.getElementById('view-eng').setAttribute('aria-pressed', String(v === 'eng'));
    document.getElementById('view-users').setAttribute('aria-pressed', String(v === 'users'));
    try { localStorage.setItem('defi-lab-view', v); } catch (e) {}
    if (rerender) LABS.forEach(update);
  }
  document.getElementById('view-eng').addEventListener('click', () => setView('eng', true));
  document.getElementById('view-users').addEventListener('click', () => setView('users', true));
  setView(view, false);

  // ---------- build page ----------
  const tabs = document.getElementById('tabs'), host = document.getElementById('labs');
  LABS.forEach(lab => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'tab-' + lab.key; b.setAttribute('aria-controls', 'lab-' + lab.key);
    b.innerHTML = `<span class="dot" id="dot-${lab.key}"></span>${lab.name}`;
    b.addEventListener('click', () => show(lab.key, true));
    tabs.appendChild(b);
    const sec = document.createElement('section');
    sec.id = 'lab-' + lab.key; sec.setAttribute('role', 'tabpanel'); sec.setAttribute('aria-labelledby', 'tab-' + lab.key); sec.hidden = true;
    sec.innerHTML = `<div class="lab-head"><h2>${lab.title}</h2><p>${lab.blurb}</p><div class="presets"><span class="lbl">Scenarios</span>${lab.presets.map((p, i) => `<button type="button" class="chip" data-p="${i}" id="${lab.key}-preset-${i}">${p.name}</button>`).join('')}</div><div class="preset-note"></div></div>
      <div class="lab-grid"><aside class="params" aria-label="${lab.name} parameters"><div class="you-only you-box"><h3 class="grp">You</h3>${lab.you.map(c => ctlHTML(lab, c)).join('')}</div>${lab.controls.map(c => ctlHTML(lab, c)).join('')}</aside><div class="outputs" id="out-${lab.key}"></div></div>`;
    host.appendChild(sec);
    lab.root = sec; lab.out = sec.querySelector('.outputs');
    sec.querySelectorAll('.presets .chip').forEach(ch => ch.addEventListener('click', () => applyPreset(lab, +ch.dataset.p)));
    lab.out.addEventListener('click', e => { const b = e.target.closest('[data-role]'); if (!b) return; lab.role = b.dataset.role; update(lab); });
    sec.querySelector('.params').addEventListener('input', e => {
      const id = e.target.dataset && e.target.dataset.ctl; if (!id) return;
      const c = allCtl(lab).find(x => x.id === id);
      const v = c.type === 'log' ? logVal(c, +e.target.value) : +e.target.value;
      lab.raw[id] = v;
      document.getElementById(lab.key + '-' + id + '-o').textContent = c.fmt(v);
      if (!lab.you.includes(c)) clearPreset(lab);
      schedule(lab);
    });
    sec.querySelector('.params').addEventListener('click', e => {
      const t = e.target.closest('button[data-ctl]'); if (!t) return;
      const c = allCtl(lab).find(x => x.id === t.dataset.ctl);
      if (c.type === 'seg') { lab.raw[c.id] = c.options[+t.dataset.i][0]; syncControls(lab); }
      else if (c.type === 'button') { lab.raw[c.id] = (lab.raw[c.id] * 48271 + 11) % 2147483647; }
      clearPreset(lab); schedule(lab);
    });
    applyPreset(lab, 0);
  });

  function show(key, remember) {
    LABS.forEach(l => {
      const on = l.key === key;
      l.root.hidden = !on;
      document.getElementById('tab-' + l.key).setAttribute('aria-selected', String(on));
    });
    const lab = LABS.find(l => l.key === key);
    drawLabCharts(lab);
    if (remember) {
      try { localStorage.setItem('defi-lab-tab', key); } catch (e) {}
      try { history.replaceState(null, '', '#' + key); } catch (e) {}
    }
  }
  let start = 'lending';
  const h = (location.hash || '').slice(1);
  if (LABS.some(l => l.key === h)) start = h;
  else { try { const s = localStorage.getItem('defi-lab-tab'); if (LABS.some(l => l.key === s)) start = s; } catch (e) {} }
  show(start, false);
  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (LABS.some(l => l.key === k)) show(k, false); });
  tabs.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = LABS.findIndex(l => !l.root.hidden);
    const j = (i + (e.key === 'ArrowRight' ? 1 : LABS.length - 1)) % LABS.length;
    show(LABS[j].key, true); document.getElementById('tab-' + LABS[j].key).focus();
  });
  const redraw = () => { const lab = LABS.find(l => !l.root.hidden); if (lab) drawLabCharts(lab); };
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redraw, 120); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw); } catch (e) {}
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
})();

</script>

</html>
